name: README version vs package

on:
  pull_request:
    paths:
      - README.md
      - fabrictools/_version.py
      - scripts/sync_readme_version.py
      - .github/workflows/readme-version.yml
  push:
    branches:
      - main
    paths:
      - README.md
      - fabrictools/_version.py
      - scripts/sync_readme_version.py
      - .github/workflows/readme-version.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify README version matches fabrictools/_version.py
        run: python scripts/sync_readme_version.py --check
